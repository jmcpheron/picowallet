<line x1="60" y1="430" x2="90" y2="430" stroke="#d62828" stroke-width="4"/>
<text x="98" y="434" font-size="12" fill="#222">red: VIN → pin 36 (3V3 OUT)</text>
<line x1="60" y1="448" x2="90" y2="448" stroke="#222" stroke-width="4"/>
<text x="98" y="452" font-size="12" fill="#222">black: GND → pin 8 (GND)</text>
<line x1="60" y1="466" x2="90" y2="466" stroke="#1f6fd6" stroke-width="4"/>
<text x="98" y="470" font-size="12" fill="#222">blue: SDA → pin 6 (GP4)</text>
<line x1="60" y1="484" x2="90" y2="484" stroke="#e0b400" stroke-width="4"/>
<text x="98" y="488" font-size="12" fill="#222">yellow: SCL → pin 7 (GP5)</text>
<rect x="930" y="130" width="220" height="70" rx="12" fill="#3a6ea5" stroke="#1d3d5c" stroke-width="2"/>
<rect x="916" y="152" width="14" height="26" fill="#bbb" stroke="#555"/>
<text x="1040" y="160" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">18650 cell (protected)</text>
<text x="1040" y="182" font-size="11" fill="#dfe" text-anchor="middle">3.0 – 4.2 V, in a holder with two leads</text>
<text x="906" y="142" font-size="18" font-weight="bold" fill="#d62828">+</text>
<text x="1154" y="142" font-size="18" font-weight="bold" fill="#222">−</text>
<path d="M 916 165 H 890 V 270 H 1040 V 316" fill="none" stroke="#d62828" stroke-width="4" stroke-linejoin="round"/>
<text x="894" y="262" font-size="11" fill="#d62828">red, battery +</text>
<rect x="970" y="316" width="150" height="96" rx="6" fill="#e8e8e8" stroke="#666" stroke-dasharray="4 3"/>
<text x="1045" y="428" font-size="11" fill="#333" text-anchor="middle">one pole of the footswitch (3 lugs)</text>
<rect x="1034" y="322" width="12" height="12" fill="#f5c542" stroke="#333"/>
<rect x="1034" y="358" width="12" height="12" fill="#f5c542" stroke="#333"/>
<rect x="1034" y="394" width="12" height="12" fill="#c8c8c8" stroke="#333"/>
<text x="1052" y="332" font-size="10" fill="#333">lug A: from battery +</text>
<text x="1052" y="368" font-size="10" fill="#333">common (middle): to diode</text>
<text x="1052" y="404" font-size="10" fill="#999">lug B: leave empty</text>
<line x1="1038" y1="360" x2="1012" y2="334" stroke="#333" stroke-width="3"/>
<text x="974" y="380" font-size="9" fill="#333">closed = ON</text>
<path d="M 1040 370 V 450" fill="none" stroke="#d62828" stroke-width="4"/>
<polygon points="1028,452 1052,452 1040,476" fill="#333"/>
<line x1="1028" y1="476" x2="1052" y2="476" stroke="#333" stroke-width="4"/>
<text x="1060" y="460" font-size="12" font-weight="bold" fill="#111">Schottky diode</text>
<text x="1060" y="474" font-size="11" fill="#333">1N5817 / 1N5819 / SS14</text>
<text x="1060" y="488" font-size="11" fill="#333">band toward the Pico</text>
<path d="M 1040 476 V 520 H 790 V 159 H 698" fill="none" stroke="#d62828" stroke-width="4" stroke-linejoin="round"/>
<text x="800" y="538" font-size="11" fill="#d62828">→ pin 39 VSYS</text>
<path d="M 1150 165 H 1215 V 550 H 760 V 186 H 698" fill="none" stroke="#222" stroke-width="4" stroke-linejoin="round"/>
<text x="1160" y="222" font-size="11" fill="#222">black,</text>
<text x="1160" y="236" font-size="11" fill="#222">battery −</text>
<text x="800" y="568" font-size="11" fill="#222">→ pin 38 GND</text>
<rect x="820" y="600" width="450" height="114" rx="6" fill="#fff6d5" stroke="#c9a227"/>
<text x="832" y="622" font-size="11" fill="#333">No diode = never plug in USB with the switch on: the Pico's own USB</text>
<text x="832" y="640" font-size="11" fill="#333">diode would push ~4.7 V straight into the cell, with no current limit.</text>
<text x="832" y="658" font-size="11" fill="#333">With the diode, USB and battery can both be on; USB wins, the cell just sits there.</text>
<text x="832" y="676" font-size="11" fill="#333">Charge the cell out of the wallet, or add a TP4056 later (WIRING.md).</text>
<text x="832" y="694" font-size="11" fill="#333">Keep solder off pin 37 (3V3_EN); never bridge 38 to 39 (dead short).</text>
</svg>